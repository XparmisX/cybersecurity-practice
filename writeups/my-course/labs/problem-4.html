//practicing different Properties, Methods, and Selectors in DOM using JS

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1 id="main-title">hello world!</h1>
<ul id="items-list">
    <li class="item">1</li>
    <li class="item">2</li>
    <li class="item">3</li>
</ul>
<button id="highlight-button">highlight</button>
<button id="change-title-button">change titke</button>
<button id="add-item-button">add item</button>
<button id="remove-item-button">remove item</button>

<script>
    const myButton1 = document.getElementById("highlight-button");
    myButton1.addEventListener('click', function() {
        const items = document.getElementsByClassName("item"); 
        for (let i = 0; i < items.length; i++) {
            items[i].classList.add("highlight");
        }
    });
    const myButton2 = document.getElementById("change-title-button");
    const mainTitle = document.getElementById("main-title");
    myButton2.addEventListener('click', function() {
        mainTitle.textContent = "new title";
    });
    const addBtn = document.getElementById("add-item-button");
    const list = document.getElementById("items-list");
    addBtn.addEventListener('click', function() {
        const newItem = document.createElement("li");
        newItem.textContent = "new item";
        newItem.classList.add("item");
        list.appendChild(newItem);
    });
    const removeBtn = document.getElementById("remove-item-button");
    removeBtn.addEventListener('click', function() {
        const lastItem = list.lastElementChild;
        list.removeChild(lastItem);
    });
</script>

</body>
</html>
